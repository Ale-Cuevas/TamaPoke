; PlatformIO build for the Waveshare ESP32-S3-Touch-AMOLED-2.16 (480x480 CO5300
; AMOLED, CST9220 touch, AXP2101 PMU). The sketch stays an Arduino sketch
; (TamaPoke.ino at the root, see README), so src_dir is the repo root and the
; filter keeps only its top-level sources.
;
; Platform, core and libraries are pinned to exact releases on purpose:
; pioarduino's "stable" tag is re-uploaded in place, and a library update can
; change what reaches the board. SensorLib / XPowersLib are the versions
; Waveshare's own 2.16 demo ships. CI builds the same sketch with arduino-cli
; and the same library versions (.github/workflows/ci.yml).
;
;   pio run -e tamapoke                    firmware
;   pio run -e tamapoke -t upload          flash it
;   pio run -e bringup -t upload           hardware test firmware (bringup/)

[platformio]
src_dir = .
default_envs = tamapoke, bringup

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
monitor_speed = 115200
board_build.flash_mode = qio
board_upload.flash_size = 16MB
; Same table as the arduino-cli FQBN and the web installer image, so the NVS
; save sits at the same offset whichever way the board was flashed.
board_build.partitions = app3M_fat9M_16MB.csv
board_build.arduino.memory_type = qio_opi
lib_deps =
    moononournation/GFX Library for Arduino@1.6.9
    lewisxhe/SensorLib@0.3.3
    lewisxhe/XPowersLib@0.2.6
    olikraus/U8g2@2.36.18
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:tamapoke]
; Only the sketch's own top-level sources: tools/, test/ and bringup/ stay out.
build_src_filter = -<*> +<*.ino> +<*.cpp>

[env:bringup]
; Standalone hardware test: each chip on its own, logged over USB serial.
; Flash this first on a new board (docs/DEVICE_TESTS.md).
build_src_filter = -<*> +<bringup/*.cpp>
; Shows what you type and sends the whole line on Enter, for `settime ...`.
monitor_echo = yes
monitor_filters = default, send_on_enter
lib_deps =
    moononournation/GFX Library for Arduino@1.6.9
    lewisxhe/SensorLib@0.3.3
    lewisxhe/XPowersLib@0.2.6
